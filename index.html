<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionneuse Setup - Squadir</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Fond noir profond */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Empêche de scroller */
        }

        /* L'image prend un maximum de place sans être déformée */
        #main-image {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            transition: opacity 0.3s ease-in-out;
        }

        /* Boutons de navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 40px;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        /* Compteur (ex: 1 / 18) */
        #counter {
            position: absolute;
            bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            letter-spacing: 2px;
        }

        /* Lien vers la tierlist en haut */
        #tierlist-link {
            position: absolute;
            top: 20px;
            color: #ffbf7f;
            text-decoration: none;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 20px;
            border-radius: 8px;
            border: 1px solid #ffbf7f;
            transition: 0.2s;
            z-index: 10;
        }

        #tierlist-link:hover {
            background: #ffbf7f;
            color: #000;
        }
    </style>
</head>
<body>

    <a id="tierlist-link" href="https://tiermaker.com/create/tierlist-setup-squadir-19418475" target="_blank">Aller faire la TierList</a>

    <button class="nav-btn" id="prev-btn" onclick="changeImage(-1)">&#10094;</button>
    
    <img id="main-image" src="" alt="Setup Image">
    
    <button class="nav-btn" id="next-btn" onclick="changeImage(1)">&#10095;</button>

    <div id="counter">1 / 18</div>

    <script>
        // Liste de tes 18 images. Change les noms si ce sont des .png par exemple
        const images = [
            "1.jpg", "2.jpg", "3.jpg", 
            "4.jpg", "5.jpg", "6.jpg", 
            "7.png", "8.jpeg", "9.jpg", 
            "10.jpg", "11.jpg", "12.jpg", 
            "13.jpg", "14.jpg", "15.jpg", 
            "16.jpg", "17.jpg", "18.png"
        ];

        let currentIndex = 0;
        const imgElement = document.getElementById("main-image");
        const counterElement = document.getElementById("counter");

        // Fonction pour afficher l'image selon l'index
        function updateImage() {
            // Petit effet de fondu
            imgElement.style.opacity = 0;
            
            setTimeout(() => {
                imgElement.src = images[currentIndex];
                counterElement.innerText = (currentIndex + 1) + " / " + images.length;
                imgElement.style.opacity = 1;
            }, 150); // Temps du fondu
        }

        // Fonction pour passer à la suivante/précédente
        function changeImage(direction) {
            currentIndex += direction;
            
            // Boucle : si on dépasse la fin, on revient au début, et inversement
            if (currentIndex >= images.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = images.length - 1;
            }
            
            updateImage();
        }

        // Écouteur pour les flèches du clavier
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                changeImage(-1);
            } else if (event.key === "ArrowRight") {
                changeImage(1);
            }
        });

        // Charger la première image au lancement
        updateImage();
    </script>

</body>
</html>
