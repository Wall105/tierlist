<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visionneuse Setup - Squadir</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #050505; /* Fond noir profond */
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden; /* Empêche de scroller */
        }

        /* L'image prend un maximum de place sans être déformée */
        #main-image {
            max-width: 95vw;
            max-height: 90vh;
            object-fit: contain;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            border-radius: 8px;
            transition: opacity 0.3s ease-in-out;
        }

        /* Nom du Setup en haut */
        #setup-name {
            position: absolute;
            top: 30px;
            font-size: 26px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.7);
            padding: 12px 30px;
            border-radius: 8px;
            letter-spacing: 2px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border-bottom: 2px solid #ffbf7f; /* Petite ligne stylée */
            z-index: 10;
            transition: opacity 0.3s ease-in-out;
        }

        /* Boutons de navigation */
        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: none;
            font-size: 40px;
            padding: 20px 15px;
            cursor: pointer;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            transition: background 0.2s;
            z-index: 10;
        }

        .nav-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        #prev-btn { left: 20px; }
        #next-btn { right: 20px; }

        /* Compteur (ex: 1 / 18) */
        #counter {
            position: absolute;
            bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px 20px;
            border-radius: 20px;
            letter-spacing: 2px;
        }
    </style>
</head>
<body>

    <div id="setup-name">Chargement...</div>

    <button class="nav-btn" id="prev-btn" onclick="changeImage(-1)">&#10094;</button>
    
    <img id="main-image" src="" alt="Setup Image">
    
    <button class="nav-btn" id="next-btn" onclick="changeImage(1)">&#10095;</button>

    <div id="counter">1 / 18</div>

    <script>
        // Liste des images AVEC leurs noms. Change les noms et les fichiers ici.
        const setups = [
            { src: "1.jpg", name: "VwExp" },
            { src: "2.jpg", name: "ytbana" },
            { src: "3.jpg", name: "Fyrax" },
            { src: "4.jpg", name: "Nyrox207z" },
            { src: "5.jpg", name: "sqd_bryan" },
            { src: "6.jpg", name: "ZenoWKEY" },
            { src: "7.png", name: "Laloane" },
            { src: "8.jpeg", name: "Slayzyxx" },
            { src: "9.jpg", name: "Clemsrider74" },
            { src: "10.jpg", name: "Zapor" },
            { src: "11.jpg", name: "Nallatic" },
            { src: "12.jpg", name: "mider" },
            { src: "13.jpg", name: "Brondi" },
            { src: "14.jpg", name: "Moha" },
            { src: "16.jpg", name: "lucille9191" },
            { src: "17.jpg", name: "togno" },
            { src: "18.png", name: "M8 Siwaa" },
            { src: "19.jpg", name: "Nanass212" }

        ];

        let currentIndex = 0;
        const imgElement = document.getElementById("main-image");
        const nameElement = document.getElementById("setup-name");
        const counterElement = document.getElementById("counter");

        // Fonction pour afficher l'image et le nom selon l'index
        function updateImage() {
            // Petit effet de fondu sur l'image et le texte
            imgElement.style.opacity = 0;
            nameElement.style.opacity = 0;
            
            setTimeout(() => {
                imgElement.src = setups[currentIndex].src;
                nameElement.innerText = setups[currentIndex].name;
                counterElement.innerText = (currentIndex + 1) + " / " + setups.length;
                
                imgElement.style.opacity = 1;
                nameElement.style.opacity = 1;
            }, 150); // Temps du fondu
        }

        // Fonction pour passer à la suivante/précédente
        function changeImage(direction) {
            currentIndex += direction;
            
            // Boucle : si on dépasse la fin, on revient au début, et inversement
            if (currentIndex >= setups.length) {
                currentIndex = 0;
            } else if (currentIndex < 0) {
                currentIndex = setups.length - 1;
            }
            
            updateImage();
        }

        // Écouteur pour les flèches du clavier
        document.addEventListener("keydown", function(event) {
            if (event.key === "ArrowLeft") {
                changeImage(-1);
            } else if (event.key === "ArrowRight") {
                changeImage(1);
            }
        });

        // Charger la première image au lancement
        updateImage();
    </script>

</body>
</html>
